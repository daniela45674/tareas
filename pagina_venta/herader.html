<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patitas Felices</title>

    <!-- ENLACE AL CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">

    <!-- LOGO -->
    <div class="logo">
        <img src="imagenes/otras_imagenes/logo2.jpg" alt="Logo">
        <span>Patitas Felices</span>
    </div>

    <!-- ICONO HAMBURGUESA MEJORADO -->
    <div id="hamburger" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- MENÚ (Estático / Sin Login) -->
    <nav id="menu" class="menu">
        <ul>
            <li><a href="home.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html">Ver pedidos</a></li>
            <li>
                <a href="carrito.html">
                    <img src="imagenes/otras_imagenes/carrito.png" class="icono-carrito" alt="Carrito">
                </a>
            </li>
            <li><a href="nosotros.html">Nosotros</a></li>
        </ul>
    </nav>

</header>

<script>
const hamburger = document.getElementById('hamburger');
const menu = document.getElementById('menu');

hamburger.addEventListener('click', function() {
    menu.classList.toggle('activo');
    menu.classList.toggle('mobile');
    hamburger.classList.toggle('active');
});

const menuLinks = menu.querySelectorAll('a');
menuLinks.forEach(link => {
    link.addEventListener('click', () => {
        if (window.innerWidth <= 900) {
            menu.classList.remove('activo', 'mobile');
            hamburger.classList.remove('active');
        }
    });
});

document.addEventListener('click', function(event) {
    const isClickInsideMenu = menu.contains(event.target);
    const isClickOnHamburger = hamburger.contains(event.target);
    
    if (!isClickInsideMenu && !isClickOnHamburger && menu.classList.contains('activo')) {
        menu.classList.remove('activo', 'mobile');
        hamburger.classList.remove('active');
    }
});
</script>

</body>
</html>
